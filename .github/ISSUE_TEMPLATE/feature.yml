name: Feature / engineering leverage
description: File a concise feature, leverage, risk-reduction, or discovery item for triage.
title: ""
labels:
  - agent-review
  - priority:triage-tbd
body:
  - type: markdown
    attributes:
      value: |
        File the smallest useful description. Your priority is an initial guess, not a self-assignment.
        Triage scans this label at least every 30 minutes; confirmation follows the target for the selected band and is not an execution TTL or stale-date.

  - type: dropdown
    id: work-type
    attributes:
      label: Work type
      options:
        - Feature
        - Engineering leverage
        - Risk reduction
        - Discovery / experiment
        - Mixed
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: What outcome or question matters?
      description: Briefly describe the capability, engineering time returned, harm reduced, or decision to unlock.
    validations:
      required: true

  - type: dropdown
    id: initial-priority-guess
    attributes:
      label: Initial priority guess
      description: This starts triage only. P0 is a candidate, not a self-assigned emergency.
      options:
        - P0 candidate
        - P1
        - P2
        - P3
        - P4
        - P5
    validations:
      required: true

  - type: input
    id: priority-guess-reason
    attributes:
      label: Why this initial priority?
      description: Give one short reason (for example, current harm, urgency, expected value, or time saved).
      placeholder: One-line reason
    validations:
      required: true

  - type: textarea
    id: relevant-details
    attributes:
      label: Relevant details (optional)
      description: |
        Add only what applies: expected user or system value, evidence, engineering workflow friction or time saved,
        failure or harm reduced, or the hypothesis and decision a discovery item will inform.

        If this changes fleet lifecycle projection or projects.json shedAbovePct, also complete the shed checklist below.

  - type: checkboxes
    id: shed-lifecycle-checklist
    attributes:
      label: Shed / lifecycle change checklist (when applicable)
      description: Required evidence when changing lifecycle or shedAbovePct. Enforcement is the AO projects.json shed gate; this form is the evidence prompt.
      options:
        - label: Linked parity / cutover receipt path (or N/A for docs-only projection sync)
        - label: projects.json and docs/FLEET-REGISTRY.md updated in the same change (or N/A)
        - label: Commission ref or CEO chat citation recorded
        - label: Rollback named (unset GATEWAY_POOL_USAGE and/or revert SHA for producer deletes)
        - label: Repo-flip list reviewed if fleet P composition changes (window-class / Gateway activate)
