name: Defect / task
description: File a concise defect, task, risk-reduction, or discovery item for triage.
title: ""
labels:
  - agent-review
  - priority:triage-tbd
body:
  - type: markdown
    attributes:
      value: |
        File the smallest useful description. Your priority is an initial guess, not a self-assignment.
        Triage scans this label at least every 30 minutes; confirmation follows the target for the selected band and is not an execution TTL or stale-date.

  - type: dropdown
    id: work-type
    attributes:
      label: Work type
      options:
        - Defect
        - Task
        - Risk reduction
        - Discovery / experiment
        - Mixed
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened or what is needed?
      description: Briefly describe the symptom, task, risk reduction, or question to answer.
    validations:
      required: true

  - type: dropdown
    id: initial-priority-guess
    attributes:
      label: Initial priority guess
      description: This starts triage only. P0 is a candidate, not a self-assigned emergency.
      options:
        - P0 candidate
        - P1
        - P2
        - P3
        - P4
        - P5
    validations:
      required: true

  - type: input
    id: priority-guess-reason
    attributes:
      label: Why this initial priority?
      description: Give one short reason (for example, current harm, urgency, expected value, or time saved).
      placeholder: One-line reason
    validations:
      required: true

  - type: textarea
    id: relevant-details
    attributes:
      label: Relevant details (optional)
      description: |
        Add only what applies: for a defect, expected vs. actual behavior and a reproduction or error;
        for risk reduction, the failure or harm to avoid; for discovery, the question or decision to unlock;
        for engineering leverage, the workflow friction or time returned.
